[Resolve]
# Quad9 only - portable to any network. Add your router by hand if you want it.
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net
# LLMNR is legacy Windows name resolution and a known relay/spoof vector.
LLMNR=no
MulticastDNS=no
# opportunistic, not strict: strict fails closed on captive-portal networks,
# which would leave a fresh install with no DNS at a hotel or venue.
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade

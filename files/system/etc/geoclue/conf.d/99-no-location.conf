# Kill every positioning source. Belt and braces alongside masking the service:
# geoclue is D-Bus activated, so masking the unit alone does not always stop it.
[network-nmea]
enable=false

[3g]
enable=false

[cdma]
enable=false

[modem-gps]
enable=false

[wifi]
enable=false
submit-data=false

[static-source]
enable=false

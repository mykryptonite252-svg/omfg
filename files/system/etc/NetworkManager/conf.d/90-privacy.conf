[connectivity]
# Stop the periodic beacon to Fedora's connectivity-check endpoint.
enabled=false

[main]
# Do not send the machine hostname to the DHCP server.
dhcp=internal

[connection]
ipv4.dhcp-send-hostname=false
ipv6.ip6-privacy=2
# Randomise MAC on Wi-Fi scans if Wi-Fi is ever used.
wifi.cloned-mac-address=stable

# IPv6: no addressing on the LAN, but the STACK STAYS UP so Tailscale works.
# accept_ra=0 + autoconf=0 means no router-advertised address is ever taken,
# which is the practical effect you wanted. disable_ipv6=1 is deliberately NOT
# set here - it would break Tailscale's overlay.
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
net.ipv6.conf.all.autoconf = 0
net.ipv6.conf.default.autoconf = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

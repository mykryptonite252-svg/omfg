name: aurora-g7
description: Aurora + G7 7590 thermal caps, webcam fixes, hardening, and apps
base-image: ghcr.io/ublue-os/aurora-nvidia-open
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
    install:
      skip-unavailable: true
      packages:
        - v4l-utils
        - code
        - clamav
        - clamav-lib
        - clamav-freshclam
        - clamav-filesystem
        - clamd
        - clamtk
        - solaar
        - mpv
        - libva-utils
        - haruna
        - btop
        - gnome-disk-utility
        - vorta
        - gnome-firmware
    remove:
      auto-remove: true
      packages:
        - hyperv-daemons
        - hypervkvpd
        - hypervvssd
        - hypervfcopyd
        - open-vm-tools
        - open-vm-tools-desktop
        - spice-vdagent
        - spice-webdavd
        - qemu-guest-agent
        - qemu-user-static-aarch64
        - mariadb-server
        - mariadb
        - mariadb-backup
        - Sunshine
        - fcitx5
        - fcitx5-chinese-addons
        - fcitx5-mozc
        - fcitx5-hangul
        - fcitx5-chewing
        - fcitx5-unikey
        - fcitx5-libthai
        - fcitx5-sayura
        - fcitx5-m17n
        - fcitx5-configtool
        - kcm-fcitx5
        - fcitx5-data
        - fcitx5-libs
        - fcitx5-lua
        - fcitx5-gtk
        - fcitx5-gtk3
        - fcitx5-gtk4
        - fcitx5-qt
        - fcitx5-qt5
        - fcitx5-qt6
        - fcitx5-qt-qt6gui
        - fcitx5-qt-libfcitx5qtdbus
        - fcitx5-qt-libfcitx5qt6widgets
        - fcitx5-chinese-addons-data
        - ibus-anthy
        - ibus-libpinyin
        - ibus-hangul
        - ibus-chewing
        - ibus-m17n
        - ibus-typing-booster
        - anthy-unicode
        - kasumi-common
        - kasumi-unicode
        - hplip
        - hplip-common
        - hplip-libs
        - plasma-print-manager
        - plasma-print-manager-libs
        - gutenprint
        - gutenprint-cups
        - splix
        - foo2zjs
        - c2esp
        - dymo-cups-drivers
        - printer-driver-brlaser
        - ptouch-driver
        - bluez-cups
        - mpage
        - sane-backends
        - sane-backends-drivers-scanners
        - sane-backends-drivers-cameras
        - sane-airscan
        - ipp-usb
        - brltty
        - brlapi
        - braille-printer-app
        - kdeplasma-addons
        - plasma-wallpapers-dynamic
        - plasma-wallpapers-dynamic-builder
        - plasma-browser-integration
        - plasma-welcome
        - plasma-vault
        - kde-connect
        - kde-connect-libs
        - kdeconnectd
        - krdp
        - krdp-libs
        - kamera
        - kairpods
        - kio-gdrive
        - kwrite
        - kfind
        - ksystemlog
        - kjournald
        - kjournald-libs
        - kdebugsettings
        - kde-partitionmanager
        - audiocd-kio
        - audiocd-kio-doc
        - gamemode
        - game-music-emu
        - oversteer-udev
        - openrgb-udev-rules
        - igt-gpu-tools
        - samba
        - samba-client
        - samba-client-libs
        - samba-common
        - samba-common-tools
        - samba-core-libs
        - samba-dcerpc
        - samba-ldb-ldap-modules
        - samba-libs
        - samba-ndr-libs
        - samba-usershares
        - samba-winbind
        - samba-winbind-clients
        - samba-winbind-modules
        - kdenetwork-filesharing
        - NetworkManager-openvpn
        - NetworkManager-openconnect
        - NetworkManager-vpnc
        - plasma-nm-openvpn
        - plasma-nm-openconnect
        - plasma-nm-vpnc
        - nfs-utils
        - autofs
        - davfs2
        - cifs-utils
        - jfsutils
        - nilfs-utils
        - ocfs2-tools
        - hfsplus-tools
        - hfsutils
        - mtools
        - lrzsz
        - gawk-all-langpacks
        - hunspell-en-AU
        - hunspell-en-CA
        - hunspell-en-GB
        - tesseract-langpack-chi_sim
        - tesseract-langpack-chi_sim_vert
        - tesseract-langpack-chi_tra
        - tesseract-langpack-chi_tra_vert
        - tesseract-langpack-jpn
        - tesseract-langpack-jpn_vert
        - tesseract-langpack-deu
        - tesseract-langpack-fra
        - tesseract-langpack-fin
        - tesseract-langpack-hin
        - tesseract-langpack-ita
        - tesseract-langpack-nld
        - tesseract-langpack-pol
        - tesseract-langpack-por
        - tesseract-langpack-spa
        - b43-fwcutter
        - b43-openfwwf
        - antiword
        - catdoc
        - input-remapper
        - v4l2loopback
        - kmod-v4l2loopback

  - type: systemd
    system:
      enabled:
        - cpu-power-cap.service
        - gpu-power-cap.service
        - flatpak-hardening.service
        - clamav-freshclam.service
      disabled:
        - NetworkManager-wait-online.service
      masked:
        - cups.service
        - cups.socket
        - cups-browsed.service
        - avahi-daemon.service
        - avahi-daemon.socket
        - ModemManager.service
        - sssd.service
        - sssd-kcm.socket
        - geoclue.service
        - zfs-import-cache.service
        - aurora-zfs-deprecation-notifier.timer
        - mdmonitor.service
        - raid-check.timer
        - systemd-homed.service
        - systemd-homed-activate.service
        - sysstat.service
        - sysstat-collect.timer
        - sysstat-summary.timer
        - sysstat-rotate.timer
        - dnf-makecache.timer
        - rpcbind.service
        - rpcbind.socket
    user:
      masked:
        - obex.service
        - podman-auto-update.timer
        - speech-dispatcher.socket

  - type: default-flatpaks
    notify: true
    system:
      install:
        - com.brave.Browser
        - org.mozilla.firefox
        - org.keepassxc.KeePassXC
        - io.ente.auth
        - us.zoom.Zoom
        - com.tutanota.Tutanota
        - it.belloworld.mercurygram
        - hu.irl.cameractrls
        - org.onlyoffice.desktopeditors
        - io.missioncenter.MissionCenter
        - com.github.tchx84.Flatseal
        - io.github.flattool.Warehouse

  - type: signing
